<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GitHub Analyzer{% endblock %}</title>
    <meta name="description" content="A portfolio-ready GitHub profile analyzer built with Flask.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
    <div class="page-shell">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <header class="site-header">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-mark">GH</span>
                <span>GitHub Analyzer</span>
            </a>
            <a class="ghost-link" href="https://github.com" target="_blank" rel="noreferrer">GitHub</a>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
